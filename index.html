<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pen Assembly Line Simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='6' y='1' width='4' height='14' rx='2' fill='%233d6fb6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="view"></div>

    <header id="topbar" class="panel">
      <span id="machine" data-state="Stopped">Stopped</span>
      <span class="sep"></span>
      <button data-cmd="start">Start</button>
      <button data-cmd="hold">Hold</button>
      <button data-cmd="unhold">Unhold</button>
      <button data-cmd="stop">Stop</button>
      <button data-cmd="abort" class="danger">E-stop</button>
      <button data-cmd="reset">Reset</button>
      <span class="sep"></span>
      <label class="speed">Speed <input id="speed" type="range" min="10" max="100" step="5" value="100" /> <b id="speed-val">100%</b></label>
      <small id="speed-actual"></small>
      <button id="catchai" data-state="off" title="CATCH.AI reporting is off. Click to turn it on.">CATCH.AI</button>
    </header>

    <aside id="side" class="panel">
      <section id="kpis">
        <div><span>Good</span><b id="k-good">0</b></div>
        <div><span>Rejected</span><b id="k-rej">0</b></div>
        <div><span>Reject rate</span><b id="k-rate">–</b></div>
        <div><span>Pens / min</span><b id="k-ppm">0</b></div>
        <div><span>Trays out</span><b id="k-trays">0</b></div>
      </section>
      <h3>Batch</h3>
      <section id="batch">
        <div class="batch-head"><b id="b-name">–</b><span id="b-state"></span></div>
        <div class="batch-bar"><i id="b-bar"></i></div>
        <div class="batch-nums"><span id="b-loaded">0 / 0 loaded</span><span id="b-out">0 good · 0 rejected</span></div>
        <div class="batch-ctl">
          <label>Size <input id="b-size" type="number" min="1" step="10" value="300" /></label>
          <button id="b-size-set">Set</button>
          <button data-cmd="endBatch">End batch</button>
          <label class="chk"><input id="b-auto" type="checkbox" checked /> Auto next</label>
        </div>
      </section>
      <h3>Faults</h3>
      <section id="faults">
        <select id="fault-target"></select>
        <button id="fault-inject" class="danger">Inject fault</button>
      </section>
      <h3>Stations</h3>
      <section id="stations"></section>
      <h3>Events</h3>
      <section id="log"></section>
    </aside>

    <aside id="inspector" class="panel" hidden>
      <header><b id="inspector-title"></b><button id="inspector-close" title="Close">×</button></header>
      <div id="inspector-body"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
